@if (formTree(); as form) {
  <form class="sf-form" (submit)="onSubmit($event)">
    @if (schema().title) {
      <h2 class="sf-form-title">{{ schema().title }}</h2>
    }
    @if (schema().description) {
      <p class="sf-form-description">{{ schema().description }}</p>
    }

    @for (fieldDef of schema().fields; track formRevision() + ':' + fieldDef.key) {
      <sf-field-renderer
        [fieldNode]="fieldDef"
        [fieldTree]="form"
        [path]="''"
        [schemaFields]="schema().fields"
        [model]="formModel()"
        (addArrayItem)="onAddArrayItem($event)"
        (removeArrayItem)="onRemoveArrayItem($event)"
      />
    }

    <div class="sf-actions">
      <button type="submit" class="sf-submit" [disabled]="submitting()">
        @if (submitting()) {
          <span class="sf-spinner"></span>
          {{ submittingLabel() }}
        } @else {
          {{ schema().submitLabel ?? 'Submit' }}
        }
      </button>
    </div>
  </form>
} @else {
  <div class="sf-form-loading" aria-live="polite">
    <span class="sf-form-loading-spinner"></span>
    <span>Preparing form…</span>
  </div>
}
